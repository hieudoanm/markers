[package]
name = "markers-graph"
version = "0.0.1"
edition = "2021"
description = "Page-link graph extraction and rendering for markers"
license = "GPL-3.0"

[dependencies]
markers-markdown = { path = "../markers-markdown" }
markers-site = { path = "../markers-site" }
pulldown-cmark = { version = "=0.13.6", default-features = false, features = ["html"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
