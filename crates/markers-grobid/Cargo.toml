[package]
name = "markers-grobid"
version = "0.0.1"
edition = "2021"
description = "PDF → Markdown via GROBID TEI XML: corpus index, search, stats, citation graph, MCP"
license = "MIT"

[dependencies]
reqwest = { version = "=0.13.5", features = ["json", "multipart"] }
tokio = { version = "=1.54.1", features = ["full"] }
roxmltree = "=0.21.2"
anyhow = "=1.0.105"
tracing = "=0.1.44"
chrono = { version = "=0.4.45", features = ["serde"] }
futures = "=0.3.34"
rusqlite = { version = "=0.43.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
urlencoding = "=2.1.3"
rmcp = { version = "=3.12.0", features = ["transport-io", "transport-streamable-http-server"] }
axum = "=0.8.9"
schemars = "=1.2.3"
