[package]
name = "markers-cli"
version = "0.0.1"
edition = "2021"
description = "Command-line interface for markers: build, init, graph, serve"
license = "GPL-3.0"

[[bin]]
name = "markers"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.8", features = ["derive"] }
markers-build = { path = "../markers-build" }
markers-graph = { path = "../markers-graph" }
markers-grobid = { path = "../markers-grobid" }
markers-landing = { path = "../markers-landing" }
markers-site = { path = "../markers-site" }
markers-wiki = { path = "../markers-wiki" }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt-multi-thread"] }
