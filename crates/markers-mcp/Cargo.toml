[package]
name = "markers-mcp"
version = "0.0.1"
edition = "2021"
description = "MCP server exposing markers as tools over stdio"
license = "GPL-3.0"

[[bin]]
name = "markers-mcp"
path = "src/main.rs"

[dependencies]
markers-build = { path = "../markers-build" }
markers-graph = { path = "../markers-graph" }
markers-markdown = { path = "../markers-markdown" }
markers-site = { path = "../markers-site" }
rmcp = { version = "=3.11.0", features = ["server", "schemars", "transport-io", "transport-streamable-http-server"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net"] }
axum = "=0.8.9"
