[package]
name = "markers-desktop"
version = "0.0.1"
description = "markers desktop app — PDF to TEI/Markdown via GROBID"
edition = "2021"
rust-version = "1.85"

# Standalone crate: not part of the markers Rust workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "=2.7.5", features = [] }

[dependencies]
tauri = { version = "=2.12.6", features = [] }
tauri-plugin-dialog = "=2.8.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
reqwest = { version = "=0.13.5", features = ["json", "multipart"] }
tokio = { version = "=1.54.1", features = ["full"] }
anyhow = "=1.0.104"
markers-grobid = { path = "../../../crates/markers-grobid" }
